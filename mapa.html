<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#019fc6">
  <meta name="robots" content="noindex">
  <title>Mapa dos votos — Fabricio Petri 36.222</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="pg-mapa">
  <!-- Login -->
  <div id="tela-login" class="login-pg" hidden>
    <header class="hero">
      <a class="voltar" href="./" aria-label="Voltar ao início"><span data-voltar></span>Início</a>
      <img class="logo" src="assets/img/logo-480.png" alt="Fabricio Petri — Deputado Estadual 36.222" width="480" height="410">
      <p class="sub">Mapa dos votos</p>
    </header>
    <form class="card login-card" id="form-login" autocomplete="on">
      <h1>Digite a senha</h1>
      <p class="muted small" style="margin:0 0 18px">Senha da Apuração ou do Partido/candidato.</p>
      <div class="campo"><label for="l-senha">Senha de acesso</label>
        <input class="input" id="l-senha" type="password" autocomplete="current-password" required></div>
      <div id="l-demo" class="aviso aviso-info small" hidden></div>
      <button class="btn btn-primario btn-xl" type="submit" id="l-entrar">Entrar</button>
    </form>
  </div>

  <div id="tela-app" hidden>
    <header class="topbar">
      <div class="topbar-in">
        <a class="logo-link" href="./" id="logo-voltar" title="Voltar"><img class="logo" src="assets/img/logo-480.png" alt="Fabricio Petri 36.222" width="480" height="410"></a>
        <div class="titulo"><b>Mapa dos votos</b><span class="oculto-mobile">Espírito Santo · Deputado Estadual · resultado por município</span></div>
        <span class="atualizado oculto-mobile" id="t-atualizado"><span class="pulso"></span><span>—</span></span>
        <a class="btn btn-topo btn-sm btn-topo-txt" href="./" id="btn-voltar"></a>
      </div>
    </header>
    <main class="wrap-l">
      <div class="acoes-painel">
        <a class="btn btn-sec btn-sm" href="relatorio-mapa.html" id="btn-rel-mapa" title="Relatório do mapa para imprimir ou salvar em PDF"></a>
        <a class="btn btn-primario btn-sm" href="telao-mapa.html" id="btn-telao-mapa" title="Abrir o mapa em tela cheia para TV"></a>
      </div>
      <div class="kpis" id="m-kpis"></div>
      <div class="mapa-grade">
        <section class="card mapa-card">
          <div class="mapa-barra">
            <div class="segmentado" role="group" aria-label="O que o mapa mostra">
              <button type="button" class="ativo" data-metrica="votos">Votos</button>
              <button type="button" data-metrica="validos">% dos votos válidos</button>
              <button type="button" data-metrica="pct">% dos eleitores</button>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" id="m-estado" hidden>Limpar seleção</button>
          </div>
          <div class="mapa-area" id="m-mapa"></div>
          <div class="mapa-legenda" id="m-legenda"></div>
          <p class="muted tiny mapa-dica">Passe o mouse para ver os números. Clique em um município para ver os detalhes ao lado.</p>
        </section>
        <aside class="card mapa-lado" id="m-lado"></aside>
      </div>
      <section class="card">
        <div class="card-titulo"><h3>Todos os municípios</h3><span class="muted tiny" id="m-tab-sub"></span></div>
        <div class="tabela-wrap"><table class="tabela responsiva" id="m-tabela"></table></div>
      </section>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/estado-tse.js"></script>
  <script src="assets/js/mapa-es.js"></script>
  <script src="assets/js/mapa.js"></script>
</body>
</html>

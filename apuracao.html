<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#019fc6">
  <meta name="robots" content="noindex">
  <title>Apuração — Fabricio Petri 36.222</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="pg-apuracao">
  <!-- Login -->
  <div id="tela-login" class="login-pg" hidden>
    <header class="hero">
      <a class="voltar" href="./" aria-label="Voltar ao início"><span data-voltar></span>Início</a>
    <img class="logo" src="assets/img/logo-480.png" alt="Fabricio Petri — Deputado Estadual 36.222" width="480" height="410">
      <p class="sub">Área da Apuração</p>
    </header>
    <form class="card login-card" id="form-login" autocomplete="on">
      <h1>Digite a senha</h1>
      <p class="muted small" style="margin:0 0 18px">Acesso restrito à equipe de apuração.</p>
      <div class="campo"><label for="l-senha">Senha de acesso</label>
        <div class="senha-box"><input class="input" id="l-senha" type="password" autocomplete="current-password" required>
          <button type="button" class="btn btn-ghost btn-sm ver" id="l-ver" aria-label="Mostrar senha"></button></div></div>
      <div id="l-demo" class="aviso aviso-info small" hidden></div>
      <button class="btn btn-primario btn-xl" type="submit" id="l-entrar">Entrar</button>
      <a class="login-voltar" href="./">← Voltar às opções de acesso</a>
    </form>
  </div>

  <!-- Sistema -->
  <div id="tela-app" hidden>
    <header class="topbar">
      <div class="topbar-in">
        <a class="logo-link" href="./" title="Início"><img class="logo" src="assets/img/logo-480.png" alt="Fabricio Petri 36.222" width="480" height="410"></a>
        <div class="titulo"><b id="t-titulo">Apuração</b><span id="t-usuario"></span></div>
        <span class="atualizado oculto-mobile" id="t-atualizado"><span class="pulso"></span><span>—</span></span>
        <button class="btn btn-topo btn-sm" id="btn-atualizar" title="Atualizar agora" aria-label="Atualizar agora"></button>
        <button class="btn btn-topo btn-sm" id="btn-sair" title="Sair" aria-label="Sair"></button>
      </div>
    </header>
    <nav class="abas" aria-label="Seções">
      <div class="abas-in" role="tablist">
        <button class="aba ativa" data-aba="painel" role="tab">Painel</button>
        <button class="aba" data-aba="conferencia" role="tab">Conferência <span class="cont" id="cont-pend">0</span></button>
        <button class="aba" data-aba="lancamentos" role="tab">Todos os envios</button>
        <button class="aba" data-aba="manual" role="tab">Lançar manualmente</button>
        <button class="aba" data-aba="parametros" role="tab">Parâmetros</button>
      </div>
    </nav>
    <main class="wrap-l">
      <section data-painel="painel">
        <div class="acoes-painel" id="acoes-painel">
          <a class="btn btn-sec btn-sm" href="telao.html" id="ap-telao"></a>
          <button class="btn btn-sec btn-sm" type="button" id="ap-excel"></button>
          <a class="btn btn-sec btn-sm" href="relatorio.html" id="ap-relatorio"></a>
          <a class="btn btn-azul btn-sm" href="mapa.html" id="ap-mapa"></a>
          <a class="btn btn-primario btn-sm btn-tse" href="tse.html" id="ap-tse"></a>
        </div>
        <div id="sec-painel"></div>
      </section>
      <section data-painel="conferencia" id="sec-conferencia" hidden></section>
      <section data-painel="lancamentos" id="sec-lancamentos" hidden></section>
      <section data-painel="manual" id="sec-manual" hidden></section>
      <section data-painel="parametros" id="sec-parametros" hidden></section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/painel.js"></script>
  <script src="assets/js/candidatos-tse-es2026.js"></script>
  <script src="assets/js/tse-logica.js"></script>
  <script src="assets/js/tse-aviso.js"></script>
  <script src="assets/js/relatorios.js"></script>
  <script src="assets/js/apuracao.js"></script>
</body>
</html>
